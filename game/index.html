<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6e6c4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Cat Trio</title>
    <!-- 고양이 박스미로 테마용 폰트: Baloo 2(라운드 굵은 숫자/헤더), Gaegu(손글씨 라벨).
         로드 실패해도 폴백(system-ui)으로 안전하게 깨진다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Gaegu:wght@700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Verse8 플랫폼 iframe 임베드용 크기 보고 프로토콜 — 부모 창이
      // REQUEST_GAME_SIZE 를 postMessage 하면 현재 렌더 크기를 응답한다.
      (function () {
        function reportGameSize() {
          const appEl = document.getElementById('app');
          if (appEl) {
            // #app 엘리먼트의 실제 렌더링된 물리 크기를 기반으로 보고하여
            // 플랫폼 에디터 상에서 아이프레임(Iframe) 크기가 게임 가로세로비(445x704)에 맞게 밀착 축소되도록 만듭니다.
            const rect = appEl.getBoundingClientRect();
            const width = Math.round(rect.width) || 445;
            const height = Math.round(rect.height) || 704;
            window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE', height, width }, '*');
          } else {
            const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
            const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
            window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE', height, width }, '*');
          }
        }
        window.addEventListener('load', reportGameSize);
        window.addEventListener('resize', reportGameSize);
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') reportGameSize();
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div class="rotate-prompt">
      <div class="icon">📱</div>
      <p>화면을 세로로 돌려주세요<br />Please rotate your device to portrait</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

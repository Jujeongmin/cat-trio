<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Cat Trio</title>
    <script>
      // Verse8 플랫폼 iframe 임베드용 크기 보고 프로토콜 — 부모 창이
      // REQUEST_GAME_SIZE 를 postMessage 하면 현재 렌더 크기를 응답한다.
      (function () {
        function reportGameSize() {
          const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
          window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE', height, width }, '*');
        }
        window.addEventListener('load', reportGameSize);
        window.addEventListener('resize', reportGameSize);
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') reportGameSize();
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
